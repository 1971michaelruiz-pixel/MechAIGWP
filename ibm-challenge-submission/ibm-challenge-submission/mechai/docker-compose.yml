version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mechai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mechai
      POSTGRES_PASSWORD: mechai
      POSTGRES_DB: mechai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechai -d mechai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (optional — uncomment to run the full stack via Docker) ───────────
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: mechai_backend
  #   restart: unless-stopped
  #   env_file: ./backend/.env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
