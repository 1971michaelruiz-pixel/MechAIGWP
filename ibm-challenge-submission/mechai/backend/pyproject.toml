[tool.poetry]
name = "mechai-backend"
version = "0.1.0"
description = "MechAI — FastAPI backend for the Mechanic Speak platform"
authors = ["MechAI Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.7"
pydantic-settings = "^2.3"
psycopg2-binary = "^2.9"
sqlalchemy = "^2.0"
python-jose = { version = "^3.3", extras = ["cryptography"] }
httpx = "^0.27"
openai = "^1.30"
pgvector = "^0.3"
python-multipart = "^0.0.9"
aiofiles = "^23.2"
reportlab = "^4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
